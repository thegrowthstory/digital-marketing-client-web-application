<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  
  .login-container {
    width: 100%;
    max-width: 400px;
    padding: 40px;
  }
  
  .login-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 40px;
  }
  
  .login-card h1 {
    text-align: center;
    margin-bottom: 28px;
    font-size: 24px;
  }
  
  .form-group {
    margin-bottom: 20px;
  }
  
  .form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
    color: var(--text);
    font-size: 14px;
  }
  
  .form-group input {
    width: 100%;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    transition: border-color 0.2s;
  }
  
  .form-group input:focus {
    outline: none;
    border-color: var(--accent);
  }
  
  .login-btn {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 3px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
  }
  
  .login-btn:hover {
    background: var(--accent-dim);
  }
  
  .login-btn:disabled {
    background: var(--muted);
    cursor: not-allowed;
  }
  
  .error-message {
    background: rgba(200, 50, 50, 0.1);
    border: 1px solid rgba(200, 50, 50, 0.3);
    color: #ff6b6b;
    padding: 12px;
    border-radius: 3px;
    margin-bottom: 20px;
    display: none;
    font-size: 13px;
  }
  
  .info-message {
    background: rgba(198, 161, 91, 0.1);
    border: 1px solid rgba(198, 161, 91, 0.3);
    color: var(--accent);
    padding: 12px;
    border-radius: 3px;
    margin-bottom: 20px;
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="grain"></div>

<div class="login-container">
  <div class="login-card">
    <h1>Admin Dashboard</h1>
    
    <div class="info-message">
      Enter your Firebase credentials to view project requests.
    </div>
    
    <div class="error-message" id="errorMessage"></div>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="your-email@example.com">
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      
      <button type="submit" class="login-btn" id="loginBtn">Login</button>
    </form>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBkDMLmKeLHZonC_dx9Nj_YC_RgmI7DiDI",
    authDomain: "projects-14a34.firebaseapp.com",
    projectId: "projects-14a34",
    storageBucket: "projects-14a34.firebasestorage.app",
    messagingSenderId: "726812157735",
    appId: "1:726812157735:web:9073901fb681b52b37ab02"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Check if already logged in
  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.location.href = 'admin.html';
    }
  });

  // Handle login
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const loginBtn = document.getElementById('loginBtn');
    const errorMessage = document.getElementById('errorMessage');
    
    loginBtn.disabled = true;
    loginBtn.textContent = 'Logging in...';
    errorMessage.style.display = 'none';
    
    try {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = 'admin.html';
    } catch (error) {
      errorMessage.textContent = error.message;
      errorMessage.style.display = 'block';
      loginBtn.disabled = false;
      loginBtn.textContent = 'Login';
    }
  });
</script>

</body>
</html>
